<!DOCTYPE html>
<html lang = "en"> 
<head> 
    <meta charset = "utf-8">
    <title> CSS Intro </title>
    <style>
        body {font-family: Arial, Helvetica, sans-serif}

        h1 {color: blue;}

        p {font-style: italic;}
        p {font-size: 1.5em;}
        p {font-weight: 700;}
        p strong {color: orange;}
    </style>
</head>

<body>
    <h1> CSS Intro </h1>
    <p> This should be in <strong> italics </strong> and in bold and the word "italics" should be orange</p>

</html>
